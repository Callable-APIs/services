/*
 * Modernized Gradle build for Tomcat deployment
 */

plugins {
    id 'java'
    id 'war'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.15'
    id 'jacoco'
    id 'com.gorylenko.gradle-git-properties' version '2.4.1'
    id 'com.bmuschko.tomcat' version '2.7.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Jersey dependencies for Tomcat
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.3'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.3'
    implementation 'org.glassfish.jersey.media:jersey-media-json-binding:3.1.3'
    implementation 'org.glassfish.jersey.core:jersey-server:3.1.3'
    implementation 'org.glassfish.jersey.ext:jersey-mvc-jsp:3.1.3'
    
    // Jakarta EE API (replaces javax)
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.jaxrs:jackson-jaxrs-json-provider:2.15.2'
    
    // Utilities
    implementation 'com.google.guava:guava:32.1.3-jre'

    // SpotBugs annotations for suppressing specific warnings where intentional
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    testImplementation 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // AWS SDK for Parameter Store
    implementation 'software.amazon.awssdk:ssm:2.21.29'
    implementation 'software.amazon.awssdk:auth:2.21.29'

    // JSON-B for simple parsing (optional, kept minimal)
    implementation 'org.eclipse:yasson:3.0.3'
    
    // YAML parsing for Ansible Vault secrets
    implementation 'org.yaml:snakeyaml:2.2'
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.0'
    
    // Mockito for testing
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.glassfish.jersey.test-framework:jersey-test-framework-core:3.1.3'
    testImplementation 'org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-grizzly2:3.1.3'
    
    // Selenium WebDriver for UI testing
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
    testImplementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.15.0'
    testImplementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.15.0'
    testImplementation 'org.seleniumhq.selenium:selenium-edge-driver:4.15.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.2'
}

// JSP precompilation using Jasper
configurations {
    jspc
}

dependencies {
    // Use Jasper CLI (JspC) from full Tomcat dist, plus Ant
    jspc 'org.apache.tomcat:tomcat-jasper:10.1.26'
    jspc 'org.apache.tomcat.embed:tomcat-embed-core:10.1.26'
    jspc 'org.apache.tomcat.embed:tomcat-embed-el:10.1.26'
    jspc 'org.eclipse.jdt:ecj:3.37.0'
    jspc 'org.apache.ant:ant:1.10.14'
    jspc 'org.apache.ant:ant-launcher:1.10.14'
    jspc 'jakarta.servlet:jakarta.servlet-api:6.0.0'
}

task precompileJsp(type: JavaExec) {
    group = 'build'
    description = 'Precompile JSPs with Jasper'
    classpath = configurations.jspc
    mainClass = 'org.apache.jasper.JspC'
    def webAppDir = file('src/main/webapp')
    def outDir = file("$buildDir/jsp")
    inputs.dir webAppDir
    outputs.dir outDir
    args = [
            '-uriroot', webAppDir.absolutePath,
            '-p', 'org.apache.jsp',
            '-d', outDir.absolutePath,
            '-compile'
    ]
}

war {
    archiveBaseName = 'ROOT'
    archiveVersion = ''
    // include precompiled JSP classes in the WAR
    from("$buildDir/jsp") {
        into 'WEB-INF/classes'
    }
    // Exclude template file from WAR - only include the generated version.properties
    exclude '**/version.properties.template'
    dependsOn precompileJsp
}



test {
    useJUnitPlatform()
    // Set timeout to prevent tests from hanging indefinitely
    // This is especially important for integration tests that use JerseyTest
    timeout = java.time.Duration.ofMinutes(5)
    
    // Fail fast on test failures
    failFast = false
    
    // Show test output
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        // Show which tests are running to help debug hangs
        showStandardStreams = true
    }
    
    // Set JVM args to help with hanging tests
    jvmArgs = [
        '-Djava.awt.headless=true',
        '-Dfile.encoding=UTF-8'
    ]
}

// UI tests configuration
sourceSets {
    uiTest {
        java {
            srcDir 'src/uiTest/java'
        }
        resources {
            srcDir 'src/uiTest/resources'
        }
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

configurations {
    uiTestImplementation.extendsFrom testImplementation
    uiTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task uiTest(type: Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.uiTest.output.classesDirs
    classpath = sourceSets.uiTest.runtimeClasspath
    shouldRunAfter test
}

// UI tests are excluded from check task to avoid CI failures
// Run manually with: ./gradlew uiTest
// check.dependsOn uiTest

checkstyle {
    toolVersion = '10.17.0'
    config = resources.text.fromFile('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = true
        html.required = true
    }
}

spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/spotbugs-exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        xml.required = false
        html.required = true
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

check.dependsOn 'checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'spotbugsTest', 'jacocoTestReport'

// Tomcat configuration for UI tests
tomcat {
    httpPort = 8080
    httpsPort = 8443
    enableSSL = false
    contextPath = '/'
}

tomcatRun {
    dependsOn war
    daemon = true
}

// Version properties generation from template
tasks.register('generateVersionProperties') {
    doLast {
        def outDir = file("$buildDir/resources/main")
        outDir.mkdirs()
        
        // Get git commit hash (full) - try multiple methods
        def gitCommitId = 'unknown'
        try {
            // Try to get from git command first
            def gitProc = "git rev-parse HEAD".execute()
            gitProc.waitFor()
            if (gitProc.exitValue() == 0) {
                gitCommitId = gitProc.text.trim()
            }
        } catch (Exception e) {
            // Fall back to environment variable
            gitCommitId = System.getenv('GIT_COMMIT_ID') ?: System.getenv('GITHUB_SHA') ?: 'unknown'
        }
        
        // Get repo name (format: owner/repo)
        def repoName = 'Callable-APIs/services'
        try {
            // Try to get from git remote
            def remoteProc = "git remote get-url origin".execute()
            remoteProc.waitFor()
            if (remoteProc.exitValue() == 0) {
                def remoteUrl = remoteProc.text.trim()
                // Extract owner/repo from git URL (handles both https and ssh formats)
                // Pattern matches: :owner/repo or /owner/repo (with optional .git suffix)
                def pattern = java.util.regex.Pattern.compile('[:/]([^/]+)/([^/]+?)(?:\\.git)?$')
                def matcher = pattern.matcher(remoteUrl)
                if (matcher.find()) {
                    def owner = matcher.group(1)
                    def repo = matcher.group(2)
                    repoName = "${owner}/${repo}"
                }
            }
        } catch (Exception e) {
            // Fall back to environment variable or default
            repoName = System.getenv('GITHUB_REPOSITORY') ?: System.getenv('REPO_NAME') ?: 'Callable-APIs/services'
        }
        
        // Get branch name
        def gitBranch = 'unknown'
        try {
            def branchProc = "git rev-parse --abbrev-ref HEAD".execute()
            branchProc.waitFor()
            if (branchProc.exitValue() == 0) {
                gitBranch = branchProc.text.trim()
            }
        } catch (Exception e) {
            gitBranch = System.getenv('GIT_BRANCH') ?: System.getenv('GITHUB_REF_NAME') ?: 'unknown'
        }
        
        // Get build time
        def buildTime = System.getenv('BUILD_TIME') ?: new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        
        // Calculate short commit hash (for backward compatibility)
        def abbrev = gitCommitId.length() > 7 ? gitCommitId.substring(0, 7) : gitCommitId
        
        // Read template file
        def templateFile = file('src/main/resources/version.properties.template')
        if (!templateFile.exists()) {
            throw new GradleException("Template file not found: ${templateFile}")
        }
        
        def templateContent = templateFile.text
        
        // Replace placeholders
        def versionContent = templateContent
            .replace('@VERSION@', abbrev)
            .replace('@FULL_COMMIT@', gitCommitId)
            .replace('@REPO@', repoName)
            .replace('@BUILD_TIME@', buildTime)
            .replace('@BRANCH@', gitBranch)
        
        // Write version.properties to build output
        def outFile = new File(outDir, 'version.properties')
        outFile.text = versionContent
        
        logger.info("Generated version.properties: repo=${repoName}, commit=${gitCommitId}, branch=${gitBranch}, time=${buildTime}")
    }
}

// Configure git-properties plugin to not fail when git is not available
tasks.named('generateGitProperties') {
    onlyIf { false } // Disable git-properties task since we use generateVersionProperties
}

// Ensure version.properties is generated before resources are processed
tasks.named('processResources') {
    dependsOn tasks.named('generateVersionProperties')
    // Exclude template file from being copied to build output
    exclude '**/version.properties.template'
}
