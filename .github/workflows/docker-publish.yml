name: Build and Push Docker Image

on:
    push:
        branches: [main, develop]
        tags: ["v*"]
    pull_request:
        branches: [main]

env:
    # Use docker.io for Docker Hub
    REGISTRY: docker.io
    # Use specific image name for Docker Hub
    IMAGE_NAME: rl337/callableapis
    # Services image tag
    SERVICES_TAG: services

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Set up Gradle
              uses: gradle/gradle-build-action@v2
              with:
                  gradle-version: 8.5

            - name: Build application
              run: ./gradlew build -x test

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ env.SERVICES_TAG }}
                      type=raw,value=${{ env.SERVICES_TAG }}-{{sha}}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./containers/services/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Disable caching temporarily to avoid cache conflicts
                  # cache-from: type=gha
                  # cache-to: type=gha,mode=max

            - name: Generate container version
              if: github.event_name != 'pull_request'
              run: |
                  # Generate container version based on git info
                  if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    # For tags, use the tag name without 'v' prefix
                    CONTAINER_VERSION=${GITHUB_REF#refs/tags/}
                    CONTAINER_VERSION=${CONTAINER_VERSION#v}
                  else
                    # For branches, use commit SHA
                    CONTAINER_VERSION=${GITHUB_SHA::8}
                  fi

                  # Add branch name for non-main branches
                  if [[ "${{ github.ref_name }}" != "main" ]]; then
                    CONTAINER_VERSION=${CONTAINER_VERSION}-${GITHUB_REF_NAME}
                  fi

                  echo "CONTAINER_VERSION=${CONTAINER_VERSION}" >> $GITHUB_ENV
                  echo "Container version: ${CONTAINER_VERSION}"

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref }}
                  body: |
                      ## Docker Image

                      **Image**: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SERVICES_TAG }}`

                      **Tags**:
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SERVICES_TAG }}`
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SERVICES_TAG }}-{{sha}}`
                      - `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest`

                      ## Usage

                      ```bash
                      docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SERVICES_TAG }}
                      docker run -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SERVICES_TAG }}
                      ```

                      ## Features

                      - Based on Alpine 3.19 with OpenJDK 21
                      - Includes Tomcat 11 for web application hosting
                      - Supports dual secrets management (Ansible Vault + AWS Parameter Store)
                      - Health checks and proper logging
                  draft: false
                  prerelease: false

            - name: Update container version file
              if: github.event_name != 'pull_request'
              run: |
                  echo "${{ env.CONTAINER_VERSION }}" > CONTAINER_VERSION
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add CONTAINER_VERSION
                  git commit -m "Update container version to ${{ env.CONTAINER_VERSION }}" || exit 0
                  git push origin HEAD:${{ github.ref_name }}
